<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LR Group of Institutes - Lost & Found Portal</title>
<style>
:root{--cyan:#00f0ff;--pink:#ff1688;--bg:#05050a;--card:rgba(10,12,22,.88);--text:#e2e8f0;--muted:#94a3b8;--border:#26324d}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{color:var(--text);min-height:100vh;line-height:1.6;background:#020308 url('background.jpg') center center/cover fixed no-repeat;position:relative}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(2,3,8,.55),rgba(2,3,8,.82)),linear-gradient(90deg,rgba(0,240,255,.08),transparent 45%,rgba(255,22,136,.08));z-index:-1}
header{background:rgba(5,5,12,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--cyan);padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;box-shadow:0 0 25px rgba(0,240,255,.18)}
header h1{color:var(--cyan);font-size:1.35rem;text-shadow:0 0 12px rgba(0,240,255,.65)}
.header-actions{display:flex;gap:.7rem;align-items:center}.lang-select,.filters input,.filters select,.form-group input,.form-group textarea,.form-group select{background:rgba(3,6,14,.9);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.65rem 1rem}.btn{background:var(--cyan);color:#031015;border:0;padding:.65rem 1.15rem;border-radius:6px;cursor:pointer;font-weight:800}.btn:hover{box-shadow:0 0 18px rgba(0,240,255,.7)}
main{max-width:1200px;margin:2rem auto;padding:0 1rem}.hero{padding:3rem 2rem;margin-bottom:2rem;border:1px solid rgba(0,240,255,.35);border-radius:12px;background:rgba(4,7,15,.62);backdrop-filter:blur(5px);box-shadow:0 0 35px rgba(0,0,0,.45)}.hero h2{font-size:clamp(2rem,5vw,4rem);color:#fff;text-shadow:0 0 18px rgba(0,240,255,.55)}.hero h2 span{color:var(--pink)}.hero p{color:#cbd5e1;max-width:650px;margin:.5rem 0 1.2rem}.filters{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}.filters input,.filters select{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem}.card{background:var(--card);border:1px solid var(--border);border-radius:9px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.45);transition:.2s}.card:hover{transform:translateY(-4px);border-color:var(--cyan);box-shadow:0 0 22px rgba(0,240,255,.22)}.card-img-container{height:160px;background:linear-gradient(135deg,#07121d,#170818);display:flex;align-items:center;justify-content:center}.card-img-container img{width:100%;height:100%;object-fit:cover}.no-photo{color:var(--muted)}.card-body{padding:1.2rem}.badge{display:inline-block;padding:.2rem .5rem;font-size:.72rem;font-weight:bold;border-radius:4px;margin-bottom:.5rem;text-transform:uppercase}.badge.lost{background:rgba(255,0,85,.15);color:#ff4d88;border:1px solid rgba(255,0,85,.3)}.badge.found{background:rgba(0,255,128,.15);color:#00ff80;border:1px solid rgba(0,255,128,.3)}.card-body h3{margin-bottom:.4rem}.card-body p{color:var(--muted);font-size:.9rem;margin-bottom:.7rem}.contact-info{color:var(--cyan);font-size:.85rem}.card-footer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--border);padding:.8rem 1.2rem;background:rgba(2,4,10,.75)}.empty-state{text-align:center;padding:3rem;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);justify-content:center;align-items:center;padding:1rem;z-index:1000}.modal-content{background:rgba(10,12,22,.97);border:1px solid var(--cyan);padding:2rem;border-radius:10px;width:100%;max-width:500px;box-shadow:0 0 35px rgba(0,240,255,.25);max-height:90vh;overflow:auto}.modal-header{display:flex;justify-content:space-between;margin-bottom:1.3rem}.close-btn{background:none;border:0;color:var(--muted);font-size:1.6rem;cursor:pointer}.form-group{margin-bottom:1rem}.form-group label{display:block;margin-bottom:.35rem}.form-group input,.form-group textarea,.form-group select{width:100%}.form-group textarea{height:85px;resize:vertical}.btn-danger{background:var(--pink);color:#fff;font-size:.75rem;padding:.3rem .6rem;margin-top:.5rem;cursor:pointer;border:0;border-radius:4px}
@media(max-width:600px){header{padding:1rem}.hero{padding:2rem 1.2rem}.header-actions{width:100%}.header-actions>*{flex:1}.hero h2{font-size:2.3rem}}
</style>
</head>
<body>
<header><h1>⚡ LR Group of Institutes - Lost & Found</h1><div class="header-actions"><select class="lang-select"><option>English</option><option>हिन्दी</option></select><button class="btn" id="openModalBtn">+ Report Item</button></div></header>
<main>
<section class="hero"><h2>LOST SOMETHING?<br><span>WE CAN HELP.</span></h2><p>Report lost items, report found items, and help your campus community reconnect with what matters.</p><button class="btn" id="heroReportBtn">Report an Item</button></section>
<div class="filters"><input id="searchInput" placeholder="Search item name or details..."><select id="statusFilter"><option value="">All Statuses</option><option value="lost">Lost</option><option value="found">Found</option></select></div>
<div class="grid" id="itemsGrid"></div>
</main>

<div class="modal" id="reportModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Report College Item</h2>
      <button class="close-btn" id="closeModalBtn">&times;</button>
    </div>
    <form id="reportForm">
      <div class="form-group"><label>Status</label><select id="itemStatus"><option value="lost">I Lost Something</option><option value="found">I Found Something</option></select></div>
      <div class="form-group"><label>Item Name</label><input id="itemName" required placeholder="e.g. Physics Notebook"></div>
      <div class="form-group"><label>Campus Location</label><input id="itemLocation" required placeholder="e.g. Library, Block A"></div>
      <div class="form-group"><label>Contact</label><input id="itemContact" required placeholder="student@college.edu"></div>
      <div class="form-group"><label>Item Photo (Optional)</label><input id="itemImage" type="file" accept="image/*"></div>
      <div class="form-group"><label>Description</label><textarea id="itemDescription" required placeholder="Add color, brand, unique markings..."></textarea></div>
      <button class="btn" style="width:100%" type="submit">Post to Portal</button>
    </form>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDwwdeSQVxHeFPEw3sAHSn-XSAW942gR1c",
    authDomain: "lost-a3d-found.firebaseapp.com",
    projectId: "lost-a3d-found",
    storageBucket: "lost-a3d-found.firebasestorage.app",
    messagingSenderId: "809491004046",
    appId: "1:809491004046:web:e908c04841d2a4a60ee7df",
    measurementId: "G-D2Y1DEJ3QN"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getFirestore(app);

  let items = [];

  const toggleModal = (show) => {
    document.getElementById('reportModal').style.display = show ? 'flex' : 'none';
  };

  document.getElementById('openModalBtn').onclick = () => toggleModal(true);
  document.getElementById('heroReportBtn').onclick = () => toggleModal(true);
  document.getElementById('closeModalBtn').onclick = () => toggleModal(false);

  // Real-time Firestore sync
  const itemsRef = collection(db, "items");
  const q = query(itemsRef, orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    renderItems();
  });

  function renderItems() {
    const grid = document.getElementById('itemsGrid');
    grid.innerHTML = '';
    if (!items.length) {
      grid.innerHTML = '<div class="empty-state">No lost or found items reported right now.</div>';
      return;
    }
    items.forEach(i => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.status = i.status;
      card.innerHTML = `
        ${i.image ? `<div class="card-img-container"><img src="${i.image}"></div>` : '<div class="card-img-container"><span class="no-photo">NO PHOTO PROVIDED</span></div>'}
        <div class="card-body">
          <span class="badge ${i.status}">${i.status}</span>
          <h3>${i.name}</h3>
          <p>${i.description}</p>
          <div class="contact-info">Contact: ${i.contact}</div>
          <button class="btn btn-danger resolve-btn" data-id="${i.id}">Mark as Resolved</button>
        </div>
        <div class="card-footer">Location: ${i.location} | Date: ${i.date}</div>
      `;
      grid.appendChild(card);
    });

    document.querySelectorAll('.resolve-btn').forEach(btn => {
      btn.onclick = async (e) => {
        const id = e.target.getAttribute('data-id');
        await deleteDoc(doc(db, "items", id));
      };
    });

    filterItems();
  }

  function filterItems() {
    const qVal = document.getElementById('searchInput').value.toLowerCase();
    const sVal = document.getElementById('statusFilter').value;
    document.querySelectorAll('.card').forEach(c => {
      c.style.display = (c.innerText.toLowerCase().includes(qVal) && (!sVal || c.dataset.status === sVal)) ? 'block' : 'none';
    });
  }

  document.getElementById('searchInput').onkeyup = filterItems;
  document.getElementById('statusFilter').onchange = filterItems;

  document.getElementById('reportForm').onsubmit = async (e) => {
    e.preventDefault();
    const fileInput = document.getElementById('itemImage');
    const newItem = {
      status: document.getElementById('itemStatus').value,
      name: document.getElementById('itemName').value,
      location: document.getElementById('itemLocation').value,
      contact: document.getElementById('itemContact').value,
      description: document.getElementById('itemDescription').value,
      date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
      createdAt: serverTimestamp(),
      image: ''
    };

    if (fileInput.files[0]) {
      const reader = new FileReader();
      reader.onload = async () => {
        newItem.image = reader.result;
        await addDoc(collection(db, "items"), newItem);
        e.target.reset();
        toggleModal(false);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      await addDoc(collection(db, "items"), newItem);
      e.target.reset();
      toggleModal(false);
    }
  };
</script>
</body>
</html>
